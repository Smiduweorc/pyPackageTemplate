[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mypackage"
version = "0.1.0"
description = "A Python library template."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "ISC" }
authors = [{ name = "grml" }]
keywords = ["python", "library", "template"]
dependencies = []

[project.urls]
Repository = "https://github.com/grMLEqomlkkU5Eeinz4brIrOVCUCkJuN/mypackage"

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "lefthook>=2.1.10",
    "git-cliff>=2.13.1",
]

[tool.hatch.build.targets.wheel]
packages = ["mypackage"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["mypackage"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "B", "SIM"]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["mypackage"]
