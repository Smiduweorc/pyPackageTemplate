# Run `lefthook install` once to wire these up.
pre-commit:
    parallel: true
    commands:
        ruff-lint:
            glob: "*.py"
            run: ruff check {staged_files}
        ruff-format:
            glob: "*.py"
            run: ruff format --check {staged_files}
        mypy:
            glob: "*.py"
            # Checks the whole package: [tool.mypy] files in pyproject.toml.
            run: mypy

commit-msg:
    commands:
        # {1} is the commit message file; only its first line is checked.
        conventional:
            run: |
                head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+' || {
                    echo "Commit message must follow Conventional Commits, e.g. 'feat: add greeting helper'." >&2
                    echo "See https://www.conventionalcommits.org" >&2
                    exit 1
                }
